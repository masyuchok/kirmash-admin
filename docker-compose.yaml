# Из корня: docker compose --env-file .env.local up -d
# Прод:     docker compose --env-file .env.production up -d
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
    - "${BIND_IP:-0.0.0.0}:${BACKEND_PORT}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Jwt__Secret=${JWT_SECRET}
      - Shopify__ApiKey=${SHOPIFY_API_KEY}
      - Shopify__ApiSecret=${SHOPIFY_API_SECRET}
      - Shopify__Shop=${SHOPIFY_SHOP:-${SHOP_DOMAIN:-}}
      - Shopify__AccessToken=${SHOPIFY_ACCESS_TOKEN:-}
      - Shopify__Scopes=${SHOPIFY_SCOPES:-read_products,write_products,read_inventory,write_inventory,read_orders,read_all_orders,read_locations,read_publications,write_publications,read_product_listings,write_product_listings}
      - Shopify__PublicationIds=${SHOPIFY_PUBLICATION_IDS:-}
      - BaseUrl=${API_URL}
      - ClientUrl=${APP_URL}
      - Auth__CookieName=${AUTH_COOKIE_NAME}
      - Auth__BukinistkaCookieName=${BUKINISTKA_COOKIE_NAME}
      - Odoo__BaseUrl=${ODOO_BASE_URL}
      - Odoo__Database=${ODOO_DATABASE}
      - Odoo__SyncLogin=${ODOO_SYNC_LOGIN:-}
      - Odoo__SyncPassword=${ODOO_SYNC_PASSWORD:-}
      - Odoo__PosSyncIntervalMinutes=${ODOO_POS_SYNC_INTERVAL_MINUTES:-10}
      - Groq__ApiKey=${GROQ_API_KEY:-}
      - Groq__Model=${GROQ_MODEL:-openai/gpt-oss-20b}
      - OpenAI__ApiKey=${OPENAI_API_KEY:-}
      - OpenAI__Model=${OPENAI_MODEL:-gpt-5.6-terra}
      - Tavily__ApiKey=${TAVILY_API_KEY:-}
      - BookLookup__MaxSupplierSearches=${BOOK_LOOKUP_MAX_SUPPLIER_SEARCHES:-4}
      - BookLookup__MaxWebSearches=${BOOK_LOOKUP_MAX_WEB_SEARCHES:-3}
      - BookLookup__MaxPresentedHits=${BOOK_LOOKUP_MAX_PRESENTED_HITS:-6}
      - BookLookup__AllowWebFallback=${BOOK_LOOKUP_ALLOW_WEB_FALLBACK:-false}
      - IMAGE_FETCH_RELAY_URL=${IMAGE_FETCH_RELAY_URL:-}
      - IMAGE_FETCH_RELAY_TOKEN=${IMAGE_FETCH_RELAY_TOKEN:-}
      - ImageFetch__DisableDirect=${IMAGE_FETCH_DISABLE_DIRECT:-false}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SHOP_DOMAIN: ${SHOP_DOMAIN}
        API_PROXY_TARGET: http://backend:8080
    ports:
      - "${BIND_IP:-0.0.0.0}:${FRONTEND_PORT}:3000"
    environment:
      - AUTH_COOKIE_NAME=${AUTH_COOKIE_NAME}
      - BUKINISTKA_COOKIE_NAME=${BUKINISTKA_COOKIE_NAME}
      - AUTH_COOKIE_DOMAIN=${AUTH_COOKIE_DOMAIN:-}
      - APP_URL=${APP_URL}
      - API_PROXY_TARGET=http://backend:8080
    depends_on:
      - backend

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
